<div class="card-deposito">
  <h2>Effettua un Deposito</h2>
  <p class="subtitle">Inserisci i dati per ricaricare il tuo conto</p>

  <form (submit)="confermaDeposito($event)">
    <div class="form-group">
      <label>Importo (€)</label>
      <input type="number" #importoInput placeholder="0.00" step="0.01" required>
    </div>

    <div class="form-group">
      <label>Descrizione</label>
      <input type="text" #descrizioneInput placeholder="Es. Versamento contanti" required>
    </div>

    <button type="submit" class="btn-confirm">Versa Ora</button>
  </form>
</div>
