<div class="movimenti-container">
      <div class="header">
        <h2>Ultimi Movimenti</h2>
        <span class="badge">{{ movimenti.length }} operazioni</span>
      </div>

      <div class="lista">
        <div class="movimento-item" *ngFor="let m of movimenti">
          <div class="icon-container" [ngClass]="m.tipo">
            <span>{{ m.tipo === 'versamento' ? '↓' : '↑' }}</span>
          </div>
          
          <div class="info">
            <span class="descrizione">{{ m.descrizione }}</span>
            <span class="data">{{ m.data | date:'dd MMM yyyy' }}</span>
          </div>

          <div class="importo" [ngClass]="m.tipo">
            {{ m.tipo === 'versamento' ? '+' : '-' }} {{ m.importo | currency:'EUR' }}
          </div>
        </div>
      </div>
</div>
