<div class="withdraw-card" [ngClass]="{'mode-home': mode === 'home', 'mode-full': mode === 'full'}">
  
  <!-- Header dinamico -->
  <div class="card-header">
    <div class="icon-badge">
      <!-- CORRETTO: Inserito l'URL ufficiale dello standard W3C per l'SVG -->
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
    <div class="header-text">
      <h2>{{ mode === 'home' ? 'Prelievo Rapido' : 'Nuovo Prelievo' }}</h2>
      @if (mode === 'full') {
        <p>Preleva fondi in tempo reale dal tuo conto EUR</p>
      }
    </div>
  </div>

  <!-- Form di Inserimento -->
  <div class="card-body">
    <div class="input-group">
      <label for="importo">Importo da prelevare</label>
      <div class="input-wrapper">
        <span class="currency-symbol">€</span>
        <!-- Input disabilitato se in caricamento -->
        <input #inputImporto [disabled]="caricamento()" type="number" id="importo" placeholder="0.00" min="0.01" step="0.01">
      </div>
    </div>

    <div class="input-group">
      <label for="descrizione">Causale / Descrizione</label>
      <!-- Input disabilitato se in caricamento -->
      <input #inputDescrizione [disabled]="caricamento()" type="text" id="descrizione" placeholder="Es. Spesa, bolletta, svago...">
    </div>
  </div>

  <!-- Footer con i bottoni di azione -->
  <div class="card-footer">
    <!-- Pulsante aggiornato con lettura del Signal e classe dinamica per lo stile grigio -->
    <button 
      [disabled]="caricamento()" 
      [class.btn-disabled]="caricamento()"
      (click)="confermaPreleva(inputImporto.value, inputDescrizione.value)" 
      class="btn btn-withdraw">
      
      @if (caricamento()) {
        <span class="spinner"></span>
        <span>Elaborazione...</span>
      } @else {
        <span>Conferma Prelievo</span>
      }
    </button>

    @if (mode === 'full' && !caricamento()) {
      <a routerLink="/home" class="btn btn-link">Annulla e torna indietro</a>
    }
  </div>

</div>
